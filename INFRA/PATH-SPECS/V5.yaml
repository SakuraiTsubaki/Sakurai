schema: sakurai.path-spec.v5
status: canonical
source_path_template: LIBRARY/{GENERATION}/{GAME}/SOURCE/{PLATFORM}/{PACKAGE}/{RELEASE}
same_game_compare_template: LIBRARY/{GENERATION}/{GAME}/COMPARE/{COMPARISON}
cross_game_compare_template: LIBRARY/{GENERATION}/COMPARE/{COMPARISON}
game_shared_template: LIBRARY/{GENERATION}/{GAME}/SHARED
generation_shared_template: LIBRARY/{GENERATION}/SHARED
game_reference_template: LIBRARY/{GENERATION}/{GAME}/REFERENCE/{REFERENCE_ID}
generation_reference_template: LIBRARY/{GENERATION}/REFERENCE/{REFERENCE_ID}
project_template: PROJECTS/{PROJECT_ID}

release_id_rules:
  gba_nds_twl: '{GAME_CODE}-HV{HEADER_VERSION}'
  gb_gbc: '{MARKET}-{LANGUAGE}-HV{HEADER_VERSION}'
  later_platforms: strongest-native-title-or-build-id-plus-software-version

current_bindings:
  black:
    path: LIBRARY/GEN-05/BLACK/SOURCE/NDS-TWL/CART/IRBO-HV0
    dump: SWEETNDS-a68b3bed
  white:
    path: LIBRARY/GEN-05/WHITE/SOURCE/NDS-TWL/CART/IRAO-HV0
    dump: SWEETNDS-f94d4578
  bw_comparison:
    path: LIBRARY/GEN-05/COMPARE/BLACK-IRBO-HV0--WHITE-IRAO-HV0

required_release_axes:
  - generation
  - game
  - source
  - platform
  - package
  - release

identity_fields_not_to_collapse_into_path:
  - market
  - language
  - preservation_set_revision_label
  - source_filename
  - dump_quality
  - provenance
  - hashes

forbidden_new_path_segments:
  - MULTI
  - REV-ALL
  - ALL
  - MULTI-REGION
  - _SHARED
  - MISC
  - OTHER
  - GENERAL
  - REV-UNKNOWN

principles:
  - release-identity-and-dump-identity-are-separate
  - native-physical-structure-and-semantic-domains-are-separate
  - equal-release-files-remain-release-owned
  - equality-and-deltas-live-in-compare
  - shared-is-only-for-identity-independent-material
  - derived-transformations-live-in-projects
  - raw-source-paths-are-never-replaced-by-unverified-semantic-names
  - original-rom-binaries-are-never-committed
  - legacy-paths-are-frozen-until-equivalence-verified
