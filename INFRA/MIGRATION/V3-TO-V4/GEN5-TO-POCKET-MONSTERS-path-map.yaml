cross_project_guard:
  - rule: generation-iv-owned-conversion-work-must-not-be-moved-into-gen5-project
  - example_source: GENERATION-IV/_SHARED/MULTI/REV-ALL/ANALYSIS/CROSS-GENERATION
    destination_project: PROJECTS/GEN4-TO-POCKET-MONSTERS
  - rule: shared-target-rom-does-not-imply-shared-project-ownership

verification_before_deleting_legacy:
  - source-and-destination-file-count-accounted-for
  - hashes-preserved-for-unchanged-files
  - internal-path-references-updated
  - project-release-lock-targets-resolve
  - no-release-fact-left-only-in-project-tree
  - no-derived-port-left-only-in-library-tree
