      original_release_fact: LIBRARY/GEN-05/NDS/<GAME>/RELEASES/<RELEASE-ID>/UI
      cross_release_comparison: LIBRARY/GEN-05/NDS/_SHARED/COMPARISONS/<COMPARISON-ID>/UI
