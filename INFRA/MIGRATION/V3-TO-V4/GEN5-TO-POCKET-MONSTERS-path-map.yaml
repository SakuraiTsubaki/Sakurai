  - legacy_path: GENERATION-V/_SHARED/MULTI/REV-ALL/ANALYSIS/BW-B2W2/STATUS-SCREEN/GEN1-5_INTEGRATION_SPEC.md
    action: reclassify-project
    reason: integration-specification-not-original-release-fact
    destination: PROJECTS/GEN5-TO-POCKET-MONSTERS/DESIGN/UI/STATUS-SCREEN/GEN1-5_INTEGRATION_SPEC.md
    status: pending-move

  - legacy_scope: GENERATION-V/_SHARED/MULTI/REV-ALL/ANALYSIS/BW-B2W2/STATUS-SCREEN
    action: classify-per-file
    reason: original-ui-research-and-derived-integration-design-may-be-mixed
