policy: semantic-split-not-blind-rename

mappings:
  - legacy_root: GENERATION-V/_SHARED/MULTI/REV-ALL/ANALYSIS/BW-EUR-REV-UNKNOWN/ROM-BASELINE-SWEETNDS
    action: split
    reason: mixed-black-white-dump-and-comparison-owner
    destinations:
      - LIBRARY/GEN-05/NDS/BLACK/RELEASES/IRBO-R0/DUMPS/SWEETNDS-a68b3bed
      - LIBRARY/GEN-05/NDS/WHITE/RELEASES/IRAO-R0/DUMPS/SWEETNDS-f94d4578
      - LIBRARY/GEN-05/NDS/_SHARED/COMPARISONS/BLACK-IRBO-R0--WHITE-IRAO-R0
    status: identities-created-content-migration-pending

  - legacy_root: GENERATION-V/_SHARED/MULTI/REV-ALL/ANALYSIS/BW-EUR-REV-MIXED/GAME-PARAMETERS/CANONICAL-RUNTIME-PASS10
    action: reclassify-project
    reason: generation-v-source-data-applied-to-older-target-runtime-parameters
    destination: PROJECTS/GEN5-TO-POCKET-MONSTERS/CROSSWALK/POKEMON/PARAMETERS/CANONICAL-RUNTIME-PASS10
    status: pending-file-level-review

  - legacy_root: GENERATION-V/_SHARED/MULTI/REV-ALL/ANALYSIS/BW-MULTI-REGION/PARAMETER-PORT
    action: reclassify-project
    reason: source-to-target-parameter-port-is-transformation-not-release-fact
    destination: PROJECTS/GEN5-TO-POCKET-MONSTERS/CROSSWALK/POKEMON/PARAMETERS/DIRECT-PARAMETER-PORT
