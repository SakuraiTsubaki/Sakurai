  global_checksum_valid_count: 23
canonical_source_path: LIBRARY/GEN-XX/<GAME-ID>/SOURCE/<PLATFORM-ID>/CART/<RELEASE-ID>
release_id_policy:
  gb_gbc: <MARKET>-<LANGUAGE>-HV<HEADER-VERSION>
  dump_id: PROJECTUPLOAD-<SHA1-PREFIX-8>
platform_policy:
  rule: title platform is canonical; filename extension and CGB/SGB flags are compatibility metadata, not path selectors
  gen1: GB
  gen2: GBC
notes:
- 'USA/Europe English ROMs are one shared release identity: US-EU-EN.'
- Korean official source ROMs in this set are Gold and Silver only.
- No Korean Crystal source release is fabricated; Korean Crystal is project output based on a real JP/EN release.
- Preservation labels such as Rev A and Yellow Rev 0A/B/C/D are metadata; header version is the canonical GB/GBC build discriminator.
- Korean Gold/Silver are both translation subjects and technical Hangul implementation references.
- English Yellow remains under GEN-01/YELLOW/SOURCE/GB/CART even though its CGB flag is 0x80 and the supplied filename extension is .gbc.
