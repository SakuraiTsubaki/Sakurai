name: Yellow complete species-variety-form data pack

on:
  push:
    paths:
      - '.github/workflows/yellow1025-data.yml'
      - 'GENERATION-I/YELLOW/1025/**'
  workflow_dispatch:

jobs:
  build-data-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Species / Variety / Form registries
        shell: python
        run: |
          import csv, io, json, urllib.request
          from pathlib import Path

          BASE='https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/'
          def get(name):
              text=urllib.request.urlopen(BASE+name).read().decode('utf-8-sig')
              return list(csv.DictReader(io.StringIO(text))), text

          species, species_raw = get('pokemon_species.csv')
          pokemon, pokemon_raw = get('pokemon.csv')
          forms, forms_raw = get('pokemon_forms.csv')

          assert len(species) == 1025, len(species)
          assert len(pokemon) == 1351, len(pokemon)
          assert len(forms) == 1579, len(forms)
          assert species[-1]['identifier'] == 'pecharunt'

          out=Path('yellow-complete-artifact')
          out.mkdir(exist_ok=True)
          (out/'pokemon_species_1025.csv').write_text(species_raw, encoding='utf-8')
          (out/'pokemon_varieties_1351.csv').write_text(pokemon_raw, encoding='utf-8')
          (out/'pokemon_forms_1579.csv').write_text(forms_raw, encoding='utf-8')

          # Compact relations used by the ROM-side generator.
          species_by_id={int(r['id']):r for r in species}
          varieties=[]
          for r in pokemon:
              sid=int(r['species_id'])
              varieties.append({
                  'pokemon_id':int(r['id']),
                  'identifier':r['identifier'],
                  'species_id':sid,
                  'national_dex':sid,
                  'is_default':r['is_default']=='1',
                  'height_dm':int(r['height']) if r['height'] else None,
                  'weight_hg':int(r['weight']) if r['weight'] else None,
                  'base_experience':int(r['base_experience']) if r['base_experience'] else None,
              })
          forms_compact=[]
          for r in forms:
              forms_compact.append({
                  'form_id':int(r['id']),
                  'identifier':r['identifier'],
                  'form_identifier':r['form_identifier'],
                  'pokemon_id':int(r['pokemon_id']),
                  'is_default':r['is_default']=='1',
                  'is_battle_only':r['is_battle_only']=='1',
                  'is_mega':r['is_mega']=='1',
                  'form_order':int(r['form_order']) if r['form_order'] else None,
                  'order':int(r['order']) if r['order'] else None,
              })

          (out/'species_index.json').write_text(json.dumps([
              {'species_id':int(r['id']),'identifier':r['identifier'],'generation_id':int(r['generation_id'])}
              for r in species
          ], ensure_ascii=False, indent=2), encoding='utf-8')
          (out/'variety_index.json').write_text(json.dumps(varieties, ensure_ascii=False, indent=2), encoding='utf-8')
          (out/'form_index.json').write_text(json.dumps(forms_compact, ensure_ascii=False, indent=2), encoding='utf-8')

          (out/'manifest.json').write_text(json.dumps({
              'species_records':len(species),
              'variety_records':len(pokemon),
              'form_records':len(forms),
              'national_dex_first':'bulbasaur',
              'national_dex_last':'pecharunt',
              'model':'form -> pokemon variety -> pokemon species',
              'rom_plan':{
                  'species_id_width_bits':16,
                  'variety_id_width_bits':16,
                  'form_id_width_bits':16,
                  'species_table':'1025 National Dex identities',
                  'variety_table':'1351 battle/stat/type/ability-capable records',
                  'form_table':'1579 visual/form records mapped onto varieties'
              },
              'source':BASE
          }, indent=2), encoding='utf-8')

      - uses: actions/upload-artifact@v4
        with:
          name: yellow-complete-species-variety-form-pack
          path: yellow-complete-artifact/
