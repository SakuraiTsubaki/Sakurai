name: Android ARM64 compatibility build

on:
  workflow_dispatch:
  push:
    paths:
      - "myboy/**"
      - "gbc-emu/**"
      - "tools/**"
      - "reports/**"
      - ".github/workflows/android-arm64.yml"

permissions:
  contents: read

env:
  NDK_VERSION: "30.0.16248370"

jobs:
  myboy-arm64:
    name: My Boy ARM64 / NDK r30
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake file git ninja-build python3

      - name: Install Android NDK r30
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "ndk;${NDK_VERSION}"
          test -f "$SDK_ROOT/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Show NDK toolchain
        shell: bash
        run: |
          echo "NDK=$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Fetch pinned mGBA
        shell: bash
        run: bash myboy/scripts/fetch-mgba.sh

      - name: Build arm64-v8a libgba.so
        shell: bash
        run: bash myboy/scripts/build-arm64.sh

      - name: Verify ELF64 AArch64 and 16 KiB PT_LOAD alignment
        shell: bash
        run: |
          SO=myboy/out/libgba.so
          file "$SO"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$SO" | tee /tmp/elf-header.txt
          grep -q 'Class:.*ELF64' /tmp/elf-header.txt
          grep -q 'Machine:.*AArch64' /tmp/elf-header.txt
          "$READELF" -lW "$SO" | tee /tmp/elf-program.txt
          python3 - <<'PY'
          import re
          rows = []
          for line in open('/tmp/elf-program.txt', encoding='utf-8'):
              if re.match(r'\s*LOAD\s', line):
                  rows.append(int(line.split()[-1], 16))
          if not rows:
              raise SystemExit('No PT_LOAD segments found')
          print('PT_LOAD alignments:', [hex(x) for x in rows])
          if any(x < 0x4000 for x in rows):
              raise SystemExit('PT_LOAD alignment below 16 KiB')
          PY

      - name: Package native artifact
        shell: bash
        run: |
          mkdir -p artifact/arm64-v8a
          cp myboy/out/libgba.so artifact/arm64-v8a/libgba.so
          cp myboy/jni_contract.json artifact/
          cp reports/source-pins.json artifact/
          cp reports/android-ndk.json artifact/

      - name: Upload libgba.so
        uses: actions/upload-artifact@v4
        with:
          name: myboy-arm64-ndk-r30
          path: artifact
          if-no-files-found: error

  gbc-emu-arm64:
    name: GBC.emu ARM64 / NDK r30
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install EX Emulators build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bash gcc-arm-linux-gnueabi file gawk gettext \
            git libtool libtool-bin make nasm pkg-config unzip wget cmake

      - name: Install Android NDK r30
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "ndk;${NDK_VERSION}"
          test -f "$SDK_ROOT/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build pinned GBC.emu ARM64
        shell: bash
        env:
          WORKDIR: ${{ github.workspace }}/gbc-modern-build
        run: bash gbc-emu/build-current-gbc.sh

      - name: Collect GBC.emu APK
        shell: bash
        run: |
          mkdir -p artifact
          find gbc-modern-build/emu-ex-plus-alpha/GBC.emu/build/android/build/outputs/apk \
            -name '*.apk' -type f -exec cp {} artifact/ \;
          test -n "$(find artifact -name '*.apk' -print -quit)"

      - name: Upload GBC.emu APK
        uses: actions/upload-artifact@v4
        with:
          name: gbc-emu-arm64-ndk-r30
          path: artifact/*.apk
          if-no-files-found: error
