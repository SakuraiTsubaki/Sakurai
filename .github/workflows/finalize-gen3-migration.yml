name: Finalize Gen III migration

on:
  push:
    branches:
      - migration/gen3-disassembly-v12
    paths:
      - .github/workflows/finalize-gen3-migration.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/gen3-disassembly-v12
          fetch-depth: 0
      - name: Sync latest main, remove this helper, and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git rm .github/workflows/finalize-gen3-migration.yml
          git commit -m "Finalize Gen III migration branch"
          git push origin HEAD:migration/gen3-disassembly-v12
          gh pr merge 112 --repo SakuraiTsubaki/Sakurai --merge
