name: Build Gen VI battle master inventories

on:
  push:
    paths:
      - '.github/workflows/build-gen6-battle-master-inventories.yml'
      - 'derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/tools/build_gen6_650_721_logical_states.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen6-battle-master-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-logical-states:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build No.650-721 logical visual-state CSV
        run: |
          python derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/tools/build_gen6_650_721_logical_states.py \
            --output derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/logical_visual_states_gen6_650_721.csv

      - name: Commit generated inventory when changed
        shell: bash
        run: |
          set -euo pipefail
          target='derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/logical_visual_states_gen6_650_721.csv'
          git add "$target"
          if git diff --cached --quiet; then
            echo 'Generated inventory is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build Gen VI 650-721 logical visual-state inventory'
          git push
