name: Fetch Gen VI secondary PNG batch 0650-0659

on:
  push:
    paths:
      - '.github/workflows/fetch-gen6-secondary-png-batch-0650-0659.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen6-secondary-png-0650-0659-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-xy-public-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch XY No.650-659 secondary evidence
        run: |
          python derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/tools/fetch_secondary_pokeapi_pngs.py \
            --game-variant x-y \
            --species 650-659 \
            --variants default,shiny,female,shiny-female \
            --output-root derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/secondary-evidence/pokeapi/x-y/batch-0650-0659/png \
            --manifest derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/secondary-evidence/pokeapi/x-y/batch-0650-0659/manifest.csv

      - name: Commit evidence batch when changed
        shell: bash
        run: |
          set -euo pipefail
          target='derived/generation-06/battle-sprites/gen3-insertion/BATTLE_MASTER_V1/secondary-evidence/pokeapi/x-y/batch-0650-0659'
          git add "$target"
          if git diff --cached --quiet; then
            echo 'Evidence batch already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Gen VI XY secondary PNG evidence batch 0650-0659'
          git push
