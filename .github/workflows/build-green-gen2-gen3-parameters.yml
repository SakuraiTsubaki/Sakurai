name: Build Green Gen2-Gen3 parameter layer

on:
  push:
    paths:
      - 'GENERATION-I/GREEN/parameters/gen2-gen3/**'
      - 'GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/**'
      - '.github/workflows/build-green-gen2-gen3-parameters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sakurai
        uses: actions/checkout@v4
        with:
          path: sakurai
          fetch-depth: 0

      - name: Checkout pokecrystal
        uses: actions/checkout@v4
        with:
          repository: pret/pokecrystal
          path: pokecrystal
          fetch-depth: 1

      - name: Checkout pokeemerald
        uses: actions/checkout@v4
        with:
          repository: pret/pokeemerald
          path: pokeemerald
          fetch-depth: 1

      - name: Extract full Generation II overlay
        run: |
          python sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/extract_gen2_full_overlay.py \
            --pokecrystal pokecrystal \
            --out sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated

      - name: Extract and verify Generation II and III parameters
        run: |
          python sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/extract_gen2_gen3_parameters.py \
            --pokecrystal pokecrystal \
            --pokeemerald pokeemerald \
            --out sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated
          base64 -w 4096 \
            sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated/green_gen2_gen3_parameter_layer.bin \
            > sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated/green_gen2_gen3_parameter_layer.b64.txt
          xz -9e -c \
            sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated/green_gen2_gen3_parameter_layer.bin \
            | base64 -w 2048 \
            > sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated/green_gen2_gen3_parameter_layer.xz.b64.txt

      - name: Build 386 plus forms cumulative runtime block
        run: |
          python sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/build_runtime_parameter_block.py \
            --gen2 sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated/gen2_personal_overlay_001_251.csv \
            --gen3 sakurai/GENERATION-I/GREEN/parameters/gen2-gen3/generated/gen3_personal_overlay_001_386.csv \
            --forms sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/form_registry.csv \
            --out-dir sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/generated
          xz -9e -c \
            sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/generated/green_386_forms_runtime_parameter_block.bin \
            | base64 -w 2048 \
            > sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/generated/green_386_forms_runtime_parameter_block.xz.b64.txt

      - name: Generate GetMonHeader hook non-ROM outputs
        run: |
          python sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/getmonheader-hook-v1/generate_nonrom_outputs.py \
            --base-runtime sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/generated/green_386_forms_runtime_parameter_block.bin \
            --map-csv sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/scaffold/green_legacy8_to_canonical16_map.csv \
            --out sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/getmonheader-hook-v1/generated

      - name: Upload deterministic runtime block artifact
        uses: actions/upload-artifact@v4
        with:
          name: green-386-forms-runtime-block
          path: |
            sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/generated/green_386_forms_runtime_parameter_block.bin
            sakurai/GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/generated/RUNTIME_BLOCK_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated non-ROM outputs
        working-directory: sakurai
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GENERATION-I/GREEN/parameters/gen2-gen3/generated \
                  GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/generated \
                  GENERATION-I/GREEN/runtime/gen1-gen3-386-forms/getmonheader-hook-v1/generated
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Generate Green Gen2-Gen3 and GetMonHeader runtime outputs'
          git pull --rebase origin main
          git push
