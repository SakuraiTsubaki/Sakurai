name: Build SILVER Gen III parameter layer

on:
  workflow_dispatch:
  push:
    paths:
      - 'GENERATION-II/SILVER/CUMULATIVE-PARAMETERS/GENERATION-III/build_gen3_parameters.py'
      - '.github/workflows/silver-gen3-parameters.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical Gen III source
        run: git clone --depth 1 https://github.com/pret/pokeemerald.git /tmp/pokeemerald
      - name: Generate normalized ledgers
        run: |
          python GENERATION-II/SILVER/CUMULATIVE-PARAMETERS/GENERATION-III/build_gen3_parameters.py \
            /tmp/pokeemerald \
            GENERATION-II/SILVER/CUMULATIVE-PARAMETERS/GENERATION-III/generated
      - name: Commit deterministic generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GENERATION-II/SILVER/CUMULATIVE-PARAMETERS/GENERATION-III/generated
          if git diff --cached --quiet; then
            echo 'Generated outputs already current.'
            exit 0
          fi
          git commit -m 'Generate Silver Generation III parameter layer'
          git push
