name: Build SILVER ENGINE-386 phase1 reference port

on:
  workflow_dispatch:
  push:
    paths:
      - 'GENERATION-II/SILVER/ENGINE-386/**'
      - '.github/workflows/silver-engine386-phase1-build.yml'

permissions:
  contents: write

env:
  RGBDS_VERSION: v1.0.3

jobs:
  build-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream sources
        run: |
          git clone --depth 1 --branch master https://github.com/fellowship-of-the-roms/pokecrystal16.git /tmp/pc16
          git -C /tmp/pc16 fetch --depth 40 origin expand-mon-ID:refs/remotes/origin/expand-mon-ID
          git clone --depth 1 https://github.com/pret/pokegold.git /tmp/pgold

      - name: Install RGBDS
        run: |
          git clone --depth 1 --branch "$RGBDS_VERSION" https://github.com/gbdev/rgbds.git /tmp/rgbds
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -C /tmp/rgbds -j$(nproc) install

      - name: Materialize maximal mechanical port candidate
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, tempfile

          pc=pathlib.Path('/tmp/pc16')
          pg=pathlib.Path('/tmp/pgold')
          out=pathlib.Path('GENERATION-II/SILVER/ENGINE-386/generated')
          out.mkdir(parents=True, exist_ok=True)

          def run(cmd,cwd=None,check=True):
              return subprocess.run(cmd,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=check)

          status=run(['git','diff','--name-status','master..origin/expand-mon-ID'],cwd=pc).stdout.splitlines()
          applied=[]; copied=[]; failed=[]; deleted=[]
          for line in status:
              parts=line.split('\t')
              st=parts[0]; path=parts[-1]
              target=pg/path
              if st.startswith('A'):
                  try:
                      data=run(['git','show',f'origin/expand-mon-ID:{path}'],cwd=pc).stdout
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_text(data)
                      copied.append(path)
                  except Exception as e:
                      failed.append({'path':path,'status':st,'reason':str(e)})
                  continue
              if st.startswith('D'):
                  if target.exists():
                      target.unlink(); deleted.append(path)
                  continue
              patch=run(['git','diff','--binary','master..origin/expand-mon-ID','--',path],cwd=pc).stdout
              tf=tempfile.NamedTemporaryFile('w',delete=False)
              tf.write(patch); tf.close()
              chk=run(['git','apply','--check',tf.name],cwd=pg,check=False)
              if chk.returncode==0:
                  ap=run(['git','apply',tf.name],cwd=pg,check=False)
                  if ap.returncode==0:
                      applied.append(path)
                  else:
                      failed.append({'path':path,'status':st,'reason':ap.stderr[-1000:]})
              else:
                  failed.append({'path':path,'status':st,'reason':chk.stderr[-1000:]})

          summary={'changed':len(status),'applied_modified':len(applied),'copied_added':len(copied),'deleted':len(deleted),'failed':len(failed),'applied_paths':applied,'copied_paths':copied,'failed_paths':failed}
          (out/'phase1_materialize.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps({k:v for k,v in summary.items() if not k.endswith('_paths')},indent=2))
          PY

      - name: Build Silver candidate
        id: build
        continue-on-error: true
        working-directory: /tmp/pgold
        run: |
          set -o pipefail
          make -j2 silver 2>&1 | tee /tmp/engine386-build.log

      - name: Record build result
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, os, hashlib
          out=pathlib.Path('GENERATION-II/SILVER/ENGINE-386/generated')
          log=pathlib.Path('/tmp/engine386-build.log').read_text(errors='replace') if pathlib.Path('/tmp/engine386-build.log').exists() else ''
          rom=pathlib.Path('/tmp/pgold/pokesilver.gbc')
          report={
            'build_outcome':'${{ steps.build.outcome }}',
            'rom_built':rom.exists(),
            'rom_bytes':rom.stat().st_size if rom.exists() else None,
            'rom_sha256':hashlib.sha256(rom.read_bytes()).hexdigest() if rom.exists() else None,
            'build_log_tail':log[-24000:]
          }
          (out/'phase1_build_report.json').write_text(json.dumps(report,indent=2)+'\n')
          (out/'phase1_build_tail.txt').write_text(log[-24000:])
          print(json.dumps({k:v for k,v in report.items() if k!='build_log_tail'},indent=2))
          PY

      - name: Commit reports
        if: always()
        run: |
          git add GENERATION-II/SILVER/ENGINE-386/generated/phase1_materialize.json GENERATION-II/SILVER/ENGINE-386/generated/phase1_build_report.json GENERATION-II/SILVER/ENGINE-386/generated/phase1_build_tail.txt
          if git diff --cached --quiet; then
            echo 'Phase1 reports already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Probe Silver ENGINE-386 reference port build'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
