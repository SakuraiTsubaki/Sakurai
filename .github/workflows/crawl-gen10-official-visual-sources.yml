name: Crawl Generation X official visual sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crawl-gen10-official-visual-sources.yml'
      - 'derived/generation-10/battle-sprites/BATTLE_MASTER_V1/crawl_official_visual_sources.py'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crawl official Japanese visual assets
        shell: bash
        run: |
          set -euo pipefail
          python derived/generation-10/battle-sprites/BATTLE_MASTER_V1/crawl_official_visual_sources.py \
            derived/generation-10/battle-sprites/BATTLE_MASTER_V1/official_visual_source_crawl.json

      - name: Commit census
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add derived/generation-10/battle-sprites/BATTLE_MASTER_V1/official_visual_source_crawl.json
          if git diff --cached --quiet; then
            echo 'No crawl changes.'
            exit 0
          fi
          git commit -m 'Census Generation X Japanese official visual sources'
          git push
