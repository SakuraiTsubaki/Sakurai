name: Gen V battle master v1 tests

on:
  push:
    paths:
      - 'GENERATION-V/BW/EUR/REV-UNKNOWN/SPRITE_ANALYSIS/BATTLE_MASTER_V1/**'
      - '.github/workflows/gen5-battle-master-v1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Run preservation-v2 generalized tests
        working-directory: GENERATION-V/BW/EUR/REV-UNKNOWN/SPRITE_ANALYSIS/BATTLE_MASTER_V1
        run: python test_preservation_v2_generalized.py
      - name: Syntax-check master builder
        working-directory: GENERATION-V/BW/EUR/REV-UNKNOWN/SPRITE_ANALYSIS/BATTLE_MASTER_V1
        run: python -m py_compile preservation_v2_generalized.py build_bw_static_master_v1.py test_preservation_v2_generalized.py
