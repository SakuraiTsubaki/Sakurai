schema: gen5-to-pocket-monsters.artifact-routing.v5
project_id: GEN5-TO-POCKET-MONSTERS

sakurai:
  owns:
    - release-and-dump-references
    - reverse-engineering
    - rom-structure-analysis
    - crosswalk-tables
    - comparison-results
    - integration-design
    - verification-evidence
    - research-tools
  roots:
    library: LIBRARY
    project: PROJECTS/GEN5-TO-POCKET-MONSTERS
    infra: INFRA

tsubaki:
  owns:
    - converted-assets
    - insertion-ready-data
    - generated-resource-indices
    - production-converters
    - patches
    - build-inputs
    - build-manifests
  root: PROJECTS/GEN5-TO-POCKET-MONSTERS

never_commit:
  - original-rom-binaries
  - full-byte-identical-rom-extractions
  - unmodified-copyrighted-asset-dumps

source_release_roots:
  black: LIBRARY/GEN-05/BLACK/SOURCE/NDS-TWL/CART/IRBO-HV0
  white: LIBRARY/GEN-05/WHITE/SOURCE/NDS-TWL/CART/IRAO-HV0
  black2: unbound-required
  white2: unbound-required

target_set:
  - GEN2-GOLD-KR-KO-HV0
  - GEN2-SILVER-AAXK-HV0
  - GEN2-CRYSTAL-JP-JA-HV0
  - GEN2-CRYSTAL-US-EU-EN-HV1
  - GEN3-RUBY-AXVJ-HV0
  - GEN3-RUBY-AXVE-HV2
  - GEN3-SAPPHIRE-AXPJ-HV0
  - GEN3-SAPPHIRE-AXPE-HV2
  - GEN3-EMERALD-BPEJ-HV0
  - GEN3-EMERALD-BPEE-HV0
  - GEN3-FIRERED-BPRJ-HV1
  - GEN3-FIRERED-BPRE-HV1
  - GEN3-LEAFGREEN-BPGJ-HV0
  - GEN3-LEAFGREEN-BPGE-HV1

identity_contract:
  release_lock: PROJECTS/GEN5-TO-POCKET-MONSTERS/MANIFESTS/release-lock.yaml
  silver_release: LIBRARY/GEN-02/SILVER/SOURCE/GBC/CART/AAXK-HV0
  silver_dump: LIBRARY/GEN-02/SILVER/SOURCE/GBC/CART/AAXK-HV0/DUMPS/PROJECT-cb22d7e0
  old_silver_alias: GEN2-SILVER-KR-KO-HV0
  old_silver_alias_status: retired-do-not-write

legacy_policy:
  new_writes_forbidden:
    - GENERATION-*
    - standalone-GEN-*
    - GAMES/*
    - LIBRARY/GEN-XX/<PLATFORM>/<GAME>/RELEASES/*
    - MULTI
    - REV-ALL
    - _SHARED
    - MISC
    - OTHER
    - GENERAL
  migration_rule: classify-by-semantic-owner-before-moving
