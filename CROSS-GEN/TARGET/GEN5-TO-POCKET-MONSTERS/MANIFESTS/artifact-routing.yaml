legacy_policy:
  new_writes_forbidden: [LIBRARY, PROJECTS, GENERATION-*, MULTI, REV-ALL, REV-UNKNOWN, _SHARED, MISC, OTHER, GENERAL]
  migration_rule: classify-by-semantic-owner-before-moving
