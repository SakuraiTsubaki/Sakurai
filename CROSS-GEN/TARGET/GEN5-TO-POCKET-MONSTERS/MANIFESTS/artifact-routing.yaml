  roots:
    generations: GEN-XX
    project: CROSS-GEN/TARGET/GEN5-TO-POCKET-MONSTERS
    infra: INFRA

tsubaki:
  owns: [converted-assets, insertion-ready-data, generated-resource-indices, production-converters, patches, build-inputs, build-manifests]
  root: CROSS-GEN/TARGET/GEN5-TO-POCKET-MONSTERS
  common: CROSS-GEN/TARGET/GEN5-TO-POCKET-MONSTERS/IMPLEMENTATION/COMMON
  target_template: CROSS-GEN/TARGET/GEN5-TO-POCKET-MONSTERS/IMPLEMENTATION/{TARGET-ID}

never_commit: [original-rom-binaries, modified-rom-binaries, rebuilt-rom-binaries]

source_release_roots:
  black: GEN-05/BLACK/SOURCE/NDS-TWL/CART/IRBO-HV0
  white: GEN-05/WHITE/SOURCE/NDS-TWL/CART/IRAO-HV0
